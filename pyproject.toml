[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "househunter"
version = "3.1.0"
description = "Rank residential multi-hazard building-loss exposure across U.S. tracts and counties"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "HouseHunter contributors" }]
dependencies = [
  "duckdb>=1.4,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "polars>=1.32,<2",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
mountain = [
  "numpy>=2.3,<3",
  "pyogrio>=0.11,<0.12",
  "pyproj>=3.7,<3.8",
  "rasterio>=1.4,<1.5",
  "scipy>=1.16,<2",
  "shapely>=2.1,<3",
]

[project.scripts]
househunter = "househunter.cli:app"

[dependency-groups]
dev = [
  "numpy>=2.3,<3",
  "pyogrio>=0.11,<0.12",
  "pyproj>=3.7,<3.8",
  "pytest>=8.4,<9",
  "rasterio>=1.4,<1.5",
  "ruff>=0.12,<1",
  "scipy>=1.16,<2",
  "shapely>=2.1,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/househunter"]

[tool.hatch.build.targets.wheel.force-include]
"config/sources.yml" = "househunter/assets/sources.yml"
"config/home-market/release-lock.json" = "househunter/assets/home_market_release_lock.json"
"config/ranking/source-lock-v2.json" = "househunter/assets/ranking_source_lock_v2.json"
"config/ranking/homeschool-policy-v1.json" = "househunter/assets/homeschool_policy_v1.json"
"config/ranking/appalachia-counties.json" = "househunter/assets/appalachia_counties.json"
"web/dist" = "househunter/static"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
